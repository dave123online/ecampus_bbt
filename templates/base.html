{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>eCampus BBT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&amp;family=Poppins:wght@600;700;800&amp;family=DM+Sans:wght@500;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.js"></script>
  <script>pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js";</script>
</head>
<body oncontextmenu="return false;">
  {% if user.is_authenticated and user.is_student %}
  <header class="site-header">
    <div class="site-header-inner">
      <a href="{% url 'home' %}" class="lp-logo" style="color:var(--dark);font-size:1.2rem;">eCampus <span style="color:var(--primary);">BBT</span></a>
      <nav class="site-nav">
        <a href="{% url 'progress:dashboard' %}"><i class="fa-solid fa-house"></i> Ma progression</a>
        <a href="{% url 'accounts:logout' %}"><i class="fa-solid fa-right-from-bracket"></i> Déconnexion</a>
      </nav>
    </div>
  </header>
  {% endif %}
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
